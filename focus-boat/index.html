<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>집중 원양어선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920;
  font-display: swap;
  src: url("PretendardVariable.woff2") format("woff2-variations");
}
/* 위젯: 연회색 바탕 가운데 작은 카드 하나. 위는 미니 바다, 아래는 타이머와 버튼 하나. 나머지는 눌러야 열림 */
:root {
  --bg: #eceef0;
  --card: #ffffff;
  --soft: #f3f5f6;
  --ink: #2a2f34;
  --mute: #828a91;
  --line: #e1e5e8;
  --accent: #2f5574;
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html { min-height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-block: 28px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.top { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: baseline; }
.brand { font-weight: 800; letter-spacing: .14em; font-size: 12px; }
.app-name { font-size: 12px; color: var(--mute); }
.note { max-width: 360px; font-size: 12.5px; color: var(--mute); text-align: center; line-height: 1.5; margin: 0; }

.widget {
  width: 100%; max-width: 360px; background: var(--card); border-radius: 22px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(30,40,50,.06), 0 12px 32px rgba(30,40,50,.08);
  display: flex; flex-direction: column;
}

/* 미니 바다 */
.scene { position: relative; height: 210px; flex: 0 0 auto; overflow: hidden; background: #dfe6ec; }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.boat { position: absolute; left: 0; top: 0; width: 240px; height: 132px; transform-origin: 0 0; will-change: transform; }
.boat svg { width: 240px; height: 132px; display: block; overflow: visible; }
.dock-pet { position: absolute; left: 0; top: 0; width: 60px; height: 64px; transform-origin: 0 0; overflow: visible; }
.bubble {
  position: absolute; left: 0; top: 0; width: max-content; max-width: 210px;
  background: #fff; color: var(--ink); border-radius: 12px; padding: 7px 11px;
  font-size: 12.5px; line-height: 1.45; font-weight: 600;
  box-shadow: 0 4px 14px rgba(30,45,60,.14); transition: opacity .25s;
}
.bubble b { font-weight: 800; }
.bubble::after { content: ""; position: absolute; left: var(--tail, 22px); top: 100%; border: 7px solid transparent; border-top-color: #fff; }
.bubble.fade { opacity: 0; }
.bounce { animation: bounce .7s ease-in-out infinite alternate; }
@keyframes bounce { to { translate: 0 -5px; } }
.wallet {
  position: absolute; right: 10px; top: 10px;
  display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px;
  font-variant-numeric: tabular-nums; background: rgba(255,255,255,.85); border-radius: 999px; padding: 4px 10px 4px 8px;
  backdrop-filter: blur(4px);
}
.wallet svg { width: 18px; height: 12px; }
.wallet.pop { animation: pop .5s; }
@keyframes pop { 40% { transform: scale(1.15); } }

/* 카드 아래쪽 */
.body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.step { display: grid; gap: 12px; }
.pets { display: flex; gap: 8px; align-items: center; }
.pet-card {
  font: inherit; cursor: pointer; padding: 0; width: 46px; height: 46px; border-radius: 50%;
  background: var(--soft); border: 2px solid transparent; display: grid; place-items: center;
}
.pet-card svg { width: 38px; height: 40px; overflow: visible; }
.pet-card[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
.pet-info { margin-left: 4px; min-width: 0; }
.pet-info b { display: block; font-size: 14px; }
.pet-info span { display: block; font-size: 12px; color: var(--mute); }
.chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); cursor: pointer;
  background: var(--soft); border: 0; border-radius: 999px; padding: 7px 12px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.custom input {
  width: 52px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); text-align: center;
  background: var(--soft); border: 0; border-radius: 999px; padding: 7px 4px;
}
.btn {
  font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%;
  background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 12px 16px;
}
.btn:disabled { opacity: .35; cursor: default; }
.links { display: flex; justify-content: space-between; gap: 8px; }
.link {
  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--mute); background: none; border: 0; padding: 4px 2px; cursor: pointer;
}
.link:hover { color: var(--ink); }
.chip:focus-visible, .btn:focus-visible, .pet-card:focus-visible, .link:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.timer-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.timer { font-size: 44px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.status { font-size: 13px; color: var(--mute); margin-top: 4px; }
.fish { font-size: 13px; font-weight: 700; text-align: right; }
.track { position: relative; height: 5px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 3px; }
.title { font-size: 17px; font-weight: 800; text-wrap: balance; }
.sub { font-size: 13px; color: var(--mute); line-height: 1.5; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn.ghost { background: var(--soft); color: var(--ink); }

/* 상점 */
.tabs { display: flex; gap: 4px; background: var(--soft); border-radius: 10px; padding: 3px; }
.tab { flex: 1; font: inherit; font-size: 13px; font-weight: 700; color: var(--mute); background: none; border: 0; border-radius: 8px; padding: 7px 4px; cursor: pointer; }
.tab[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.shop { display: grid; gap: 6px; max-height: 230px; overflow-y: auto; }
.item { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item svg { width: 34px; height: 32px; flex: 0 0 auto; overflow: visible; }
.item .txt { flex: 1; min-width: 0; }
.item b { display: block; font-size: 13.5px; }
.item span { display: block; font-size: 11.5px; color: var(--mute); }
.buy {
  font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 6px 11px;
}
.buy.owned { background: var(--soft); color: var(--ink); }
.buy:disabled { opacity: .35; cursor: default; }
.state { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }

.popped { width: 100%; max-width: 360px; background: var(--card); border-radius: 22px; padding: 28px 16px; text-align: center; color: var(--mute); font-size: 14px; display: grid; gap: 12px; box-sizing: border-box; }
.popped .btn { width: auto; justify-self: center; }

/* 작은 창(PIP) 안 */
.pip body { padding: 0; display: block; background: var(--card); }
.pip .widget { max-width: none; border-radius: 0; box-shadow: none; min-height: 100vh; }
.pip .scene { height: 170px; }
.pip .body { padding: 10px 12px 12px; gap: 10px; }
.pip .timer { font-size: 36px; }
.pip .pip-hide { display: none !important; }
@media (prefers-reduced-motion: reduce) { .bounce { animation: none; } }
</style>
</head>
<body>

<div class="top"><span class="brand">EMPTY CHAIR</span><span class="app-name">집중 원양어선</span></div>

<div class="widget" id="widget">
  <div class="scene" id="scene">
    <canvas id="sea"></canvas>
    <svg class="dock-pet" id="dockPet" viewBox="0 0 60 64" aria-hidden="true"></svg>
    <div class="boat" id="boat"><svg viewBox="0 0 240 132" id="boatSvg" aria-label="펫이 탄 고기잡이 배"></svg></div>
    <div class="bubble" id="bubble"></div>
    <span class="wallet" id="wallet" title="모은 물고기">
      <svg viewBox="0 0 22 14" aria-hidden="true"><path d="M2 7 Q8 0 15 7 Q8 14 2 7 Z" fill="#2f5574"/><path d="M14 7 L21 2 V12 Z" fill="#2f5574"/><circle cx="6" cy="6" r="1.2" fill="#fff"/></svg>
      <span id="walletNum">0</span>
    </span>
  </div>

  <div class="body">
    <!-- 1. 출항 전 -->
    <div class="step" id="stepPick">
      <div class="pets" id="pets"></div>
      <div class="chips" id="chips">
        <button class="chip" data-min="15" aria-pressed="false">15분</button>
        <button class="chip" data-min="25" aria-pressed="true">25분</button>
        <button class="chip" data-min="50" aria-pressed="false">50분</button>
        <button class="chip" data-min="90" aria-pressed="false">90분</button>
        <label class="custom"><input id="customMin" type="number" min="1" max="300" placeholder="직접" inputmode="numeric" aria-label="직접 입력(분)"></label>
      </div>
      <button class="btn" id="go">25분 출항시키기</button>
      <div class="links">
        <button class="link" id="openShop">상점</button>
        <span class="status" id="pickHint"></span>
        <button class="link pip-hide" id="pipBtn" hidden>작은 창으로 띄우기</button>
      </div>
    </div>

    <!-- 2. 항해 중 -->
    <div class="step" id="stepSail" hidden>
      <div class="timer-row">
        <div><div class="timer" id="timer">25:00</div><div class="status" id="sailStatus">먼 바다로 나가는 중</div></div>
        <div class="fish" id="fishNow">물고기 0마리</div>
      </div>
      <div class="track"><i id="bar"></i></div>
      <div class="links">
        <button class="link" id="quit">일찍 돌아오기</button>
        <button class="link" id="ff" hidden>시안용 빨리감기</button>
      </div>
    </div>

    <!-- 2-1. 일찍 돌아오기 확인 -->
    <div class="step" id="stepQuit" hidden>
      <div><div class="title">정말 배를 돌릴까요?</div><div class="sub">지금 돌아오면 그물 속 물고기의 절반만 가져와요.</div></div>
      <div class="btn-row"><button class="btn ghost" id="quitYes">돌아오기</button><button class="btn" id="quitNo">계속 집중</button></div>
    </div>

    <!-- 3. 귀항 -->
    <div class="step" id="stepDone" hidden>
      <div><div class="title" id="doneTitle"></div><div class="sub" id="doneText"></div></div>
      <div class="btn-row"><button class="btn ghost" id="doneShop">상점</button><button class="btn" id="again">다시 출항</button></div>
    </div>

    <!-- 상점 -->
    <div class="step" id="stepShop" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="crew" aria-selected="true">항해원</button>
        <button class="tab" role="tab" data-tab="flag" aria-selected="false">깃발</button>
        <button class="tab" role="tab" data-tab="outfit" aria-selected="false">옷</button>
      </div>
      <div class="shop" id="shopList"></div>
      <div class="links">
        <button class="link" id="closeShop">돌아가기</button>
        <button class="link" id="demoFish" hidden>시안용 물고기 +30</button>
      </div>
    </div>
  </div>
</div>

<div class="popped" id="popped" hidden>
  <div>위젯이 작은 창으로 나가서 화면 위에 떠 있어요.<br>다른 탭에서 공부해도 계속 보여요.</div>
  <button class="btn ghost" id="pipBack">다시 데려오기</button>
</div>

<p class="note" id="note">크롬이나 엣지에서 "작은 창으로 띄우기"를 누르면 다른 탭이나 프로그램 위에도 떠 있어요.</p>

<script>
(() => {
  const cache = {};
  const $ = (id) => cache[id] || (cache[id] = document.getElementById(id));
  document.querySelectorAll('[id]').forEach((el) => { cache[el.id] = el; }); // 장면이 작은 창으로 옮겨가도 찾을 수 있게

  const OL = '#4a3328';
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  /* ---------- 펫 ---------- */
  const PETS = {
    mong: { name: '몽글', kind: '아기 물범', desc: '겁 많고 잘 우는데 끝까지 버텨요', headTop: 14, neck: 46 },
    dal:  { name: '달달', kind: '해달', desc: '시끄럽고 신나는 분위기 메이커', headTop: 15, neck: 47 },
    moon: { name: '문문', kind: '문어', desc: '시크하고 어른스러운 잔소리꾼', headTop: 8, neck: 40 },
  };
  const ORDER = ['mong', 'dal', 'moon'];

  const fishSvg = (x, y, s = 1, c = '#8fb3c9', flip = false) =>
    `<g transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})"><path d="M-6 0 Q0 -5 6 0 Q0 5 -6 0Z" fill="${c}" stroke="${OL}" stroke-width="1.1"/><path d="M6 0 L10.5 -3.8 L10.5 3.8Z" fill="${c}" stroke="${OL}" stroke-width="1.1" stroke-linejoin="round"/><circle cx="-3" cy="-0.8" r="0.9" fill="${OL}"/></g>`;
  const blush = (x, y) => `<ellipse cx="${x + 3}" cy="${y}" rx="4.2" ry="2.4" fill="#f6b3b5" opacity=".7"/><path d="M${x} ${y + 1} l1.6 -2.2 M${x + 2.6} ${y + 1.2} l1.6 -2.2 M${x + 5.2} ${y + 1.4} l1.6 -2.2" stroke="#e98b92" stroke-width="1.1" stroke-linecap="round"/>`;
  const dotEyes = (y = 35) => `<circle cx="22" cy="${y}" r="2.7" fill="${OL}"/><circle cx="38" cy="${y}" r="2.7" fill="${OL}"/><circle cx="22.9" cy="${y - 0.9}" r=".9" fill="#fff"/><circle cx="38.9" cy="${y - 0.9}" r=".9" fill="#fff"/>`;

  function outfitSvg(id, item) {
    const p = PETS[id];
    if (item === 'scarf') return `<path d="M11 ${p.neck} Q30 ${p.neck + 7} 49 ${p.neck} L49 ${p.neck + 5} Q30 ${p.neck + 12} 11 ${p.neck + 5}Z" fill="#d9574f" stroke="${OL}" stroke-width="1.8"/><path d="M39 ${p.neck + 6} l3 10 l5 -1.5 l-2 -9" fill="#d9574f" stroke="${OL}" stroke-width="1.8" stroke-linejoin="round"/>`;
    const t = p.headTop;
    if (item === 'rain') return `<g transform="translate(0 ${t - 15})"><path d="M14 19 Q30 -3 46 19Z" fill="#f2c94c" stroke="${OL}" stroke-width="2"/><path d="M6 18 Q30 27 54 18 Q30 22 6 18Z" fill="#f2c94c" stroke="${OL}" stroke-width="2" stroke-linejoin="round"/></g>`;
    if (item === 'captain') return `<g transform="translate(0 ${t - 13})"><path d="M15 17 Q15 3 30 3 Q45 3 45 17Z" fill="#fbfbfb" stroke="${OL}" stroke-width="2"/><rect x="12" y="15" width="36" height="5.5" rx="2.5" fill="#2f4a63" stroke="${OL}" stroke-width="1.6"/><path d="M30 7 v6 M27.5 11.5 q2.5 2.5 5 0" stroke="#d4a82a" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;
    if (item === 'beanie') return `<g transform="translate(0 ${t - 12})"><path d="M14 18 Q14 2 30 2 Q46 2 46 18Z" fill="#6f93b0" stroke="${OL}" stroke-width="2"/><rect x="12" y="14" width="36" height="6" rx="3" fill="#a9c1d3" stroke="${OL}" stroke-width="1.6"/><circle cx="30" cy="1" r="4" fill="#f3f5f7" stroke="${OL}" stroke-width="1.6"/></g>`;
    return '';
  }

  // pose: idle | sign(귀항 시그니처) | sad
  function petSvg(id, pose = 'idle', outfit = null, n = 0) {
    let s = '';
    const face = pose === 'sign' || pose === 'catch';
    const col = { mong: '#e9eef2', dal: '#b98c63', moon: '#f0a092' }[id];
    if (pose === 'catch') s += `<path d="M11 42 Q3 22 11 3 Q17 1 18 6 Q13 24 17 38Z" fill="${col}" stroke="${OL}" stroke-width="2"/><path d="M49 42 Q57 22 49 3 Q43 1 42 6 Q47 24 43 38Z" fill="${col}" stroke="${OL}" stroke-width="2"/>`;
    const body = 'M8 46 C6 26 16 14 30 14 C44 14 54 26 52 46 C51 58 42 62 30 62 C18 62 9 58 8 46Z';
    if (id === 'mong') {
      const c = '#e9eef2';
      if (pose === 'sign') s += `<path d="M12 40 Q2 30 6 23 Q13 26 16 36" fill="${c}" stroke="${OL}" stroke-width="2"/><path d="M48 40 Q58 30 54 23 Q47 26 44 36" fill="${c}" stroke="${OL}" stroke-width="2"/>`;
      s += `<path d="${body}" fill="${c}" stroke="${OL}" stroke-width="2.2"/><ellipse cx="18" cy="26" rx="2" ry="1.4" fill="#c9d3db"/><ellipse cx="44" cy="52" rx="2.4" ry="1.6" fill="#c9d3db"/><ellipse cx="40" cy="22" rx="1.4" ry="1" fill="#c9d3db"/>`;
      if (face) {
        s += `<circle cx="22" cy="35" r="3.6" fill="${OL}"/><circle cx="38" cy="35" r="3.6" fill="${OL}"/><circle cx="23.2" cy="33.7" r="1.3" fill="#fff"/><circle cx="39.2" cy="33.7" r="1.3" fill="#fff"/><circle cx="21" cy="36.5" r=".6" fill="#fff"/><circle cx="37" cy="36.5" r=".6" fill="#fff"/>`;
        s += `<path d="M18 39 q-1.5 4 0 6 q1.5 -2 0 -6Z M42 39 q-1.5 4 0 6 q1.5 -2 0 -6Z" fill="#8fc3e6"/>`;
        s += `<path d="M26 43 Q30 48 34 43" fill="#e98b92" stroke="${OL}" stroke-width="1.6"/>`;
      } else if (pose === 'sad') {
        s += `<path d="M19 33 l6 2 M41 33 l-6 2" stroke="${OL}" stroke-width="1.6" stroke-linecap="round"/>` + dotEyes(37) + `<path d="M27 45 Q30 43 33 45" fill="none" stroke="${OL}" stroke-width="1.6" stroke-linecap="round"/>`;
      } else {
        s += dotEyes(35) + `<path d="M26.5 43.5 Q28.3 45.8 30 43.5 Q31.7 45.8 33.5 43.5" fill="none" stroke="${OL}" stroke-width="1.6" stroke-linecap="round"/>`;
      }
      s += `<ellipse cx="30" cy="40.6" rx="2.2" ry="1.5" fill="${OL}"/>` + blush(13, 42) + blush(41, 42);
      if (!face) s += `<path d="M10 48 Q2 52 5 58 Q11 57 14 52" fill="${c}" stroke="${OL}" stroke-width="2"/><path d="M50 48 Q58 52 55 58 Q49 57 46 52" fill="${c}" stroke="${OL}" stroke-width="2"/>`;
      else if (pose === 'sign') s += fishSvg(30, 55, 1.15, '#e9a46a');
    }
    if (id === 'dal') {
      const c = '#b98c63', f = '#f4e3ca';
      if (pose === 'sign') s += `<path d="M13 40 Q4 26 9 16 Q15 18 18 34" fill="${c}" stroke="${OL}" stroke-width="2"/><path d="M47 40 Q56 26 51 16 Q45 18 42 34" fill="${c}" stroke="${OL}" stroke-width="2"/>` + fishSvg(30, 8, 1.3, '#8fb3c9');
      s += `<circle cx="15" cy="21" r="4.6" fill="${c}" stroke="${OL}" stroke-width="2"/><circle cx="45" cy="21" r="4.6" fill="${c}" stroke="${OL}" stroke-width="2"/><circle cx="15" cy="21" r="2" fill="#8e6646"/><circle cx="45" cy="21" r="2" fill="#8e6646"/>`;
      s += `<path d="${body}" fill="${c}" stroke="${OL}" stroke-width="2.2"/><ellipse cx="30" cy="40" rx="15" ry="11" fill="${f}"/>`;
      if (face) s += `<path d="M19 32 l4 3 l-4 3 M41 32 l-4 3 l4 3" fill="none" stroke="${OL}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M25.5 42.5 Q30 49 34.5 42.5Z" fill="#e98b92" stroke="${OL}" stroke-width="1.5"/>`;
      else if (pose === 'sad') s += dotEyes(36) + `<path d="M27 45.5 Q30 43.5 33 45.5" fill="none" stroke="${OL}" stroke-width="1.6" stroke-linecap="round"/>`;
      else s += dotEyes(34.5) + `<path d="M30 41.5 v1.5 M26.8 43.6 Q28.4 45.6 30 43 Q31.6 45.6 33.2 43.6" fill="none" stroke="${OL}" stroke-width="1.6" stroke-linecap="round"/>`;
      s += `<path d="M27.2 38 h5.6 q-.8 3 -2.8 3 q-2 0 -2.8 -3Z" fill="${OL}"/>` + blush(13, 42) + blush(41, 42);
      s += `<circle cx="16" cy="44" r=".7" fill="${OL}"/><circle cx="44" cy="44" r=".7" fill="${OL}"/>`;
      if (!face) s += `<ellipse cx="30" cy="54" rx="5" ry="3.4" fill="#e7d3e0" stroke="${OL}" stroke-width="1.5"/><path d="M27 54 h6 M28 52.5 h4" stroke="${OL}" stroke-width=".8"/><circle cx="23" cy="53" r="3.6" fill="${c}" stroke="${OL}" stroke-width="1.8"/><circle cx="37" cy="53" r="3.6" fill="${c}" stroke="${OL}" stroke-width="1.8"/>`;
    }

        const y = y0 + (Math.sin(a) + 0.45 * Math.sin(a * 2.3 + i * 4.1 - t * 0.4)) * amp;
        const crest = Math.sin(x / (len * 2.7) + i * 2.3 + t * 0.15) + 0.4 * Math.sin(x / (len * 0.9) - i);
        if (crest > -0.2) { pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; } else pen = false;
      }
      g.stroke();
      g.strokeStyle = `rgba(35,60,85,${0.05 + d * 0.12})`;
      g.beginPath();
      for (let x = -20; x < W + 20; x += 6) {
        const a = x / len * 6.28 + t * sp + i * 1.9 + 1.2;
        const y = y0 + amp * 1.6 + (Math.sin(a) + 0.45 * Math.sin(a * 2.3 + i * 4.1 - t * 0.4)) * amp;
        x === -20 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
    }
    // 부두
    const plank = Math.max(6, 11 * s0);
    g.fillStyle = '#6b5644';
    for (let px = 10; px < pierW - 4; px += pierW / 3) g.fillRect(px, deckY + plank, 6 * s0 + 3, H - deckY);
    g.fillStyle = 'rgba(75,108,134,.55)'; g.fillRect(0, nearY + 6, pierW, H - nearY);
    g.fillStyle = '#a38667'; g.fillRect(0, deckY, pierW, plank);
    g.fillStyle = '#8a6e52'; g.fillRect(0, deckY + plank - 2, pierW, 2);
    g.strokeStyle = 'rgba(80,60,40,.45)'; g.lineWidth = 1;
    for (let px = 8; px < pierW; px += 14) { g.beginPath(); g.moveTo(px, deckY); g.lineTo(px, deckY + plank - 2); g.stroke(); }
    g.fillStyle = '#3f4a52'; g.fillRect(pierW - 14 * s0 - 4, deckY - 8 * s0, 8 * s0 + 2, 8 * s0);
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.6;
    g.beginPath();
    for (let x = 0; x < pierW + 10; x += 5) { const y = nearY + 8 + Math.sin(x / 14 + t * 1.4) * 2; x === 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
  }

  /* ---------- 배와 말풍선 위치 ---------- */
  function boatPose(t) {
    const { W, hz, nearY, pierW, s0 } = geo;
    let q = Math.sin(Math.PI * clamp(progress, 0, 1));
    if (homeAnim) { // 일찍 돌아올 때: 지금 위치에서 부두로 빠르게
      const k = clamp((performance.now() - homeAnim.t0) / 2200, 0, 1);
      q = homeAnim.q * Math.pow(1 - k, 3);
      if (k >= 1 && homeAnim.cb) { const cb = homeAnim.cb; homeAnim = null; cb(); q = 0; }
    }
    const x0 = pierW - 30 * s0, x1 = W * 0.6;
    const wl0 = nearY, wl1 = hz + 10;
    const e = Math.pow(q, 0.8);
    const s = lerp(s0, s0 * 0.32, e), x = lerp(x0, x1, q), wl = lerp(wl0, wl1, e);
    const bob = Math.sin(t * 1.7) * 2.6 * s / s0, rot = Math.sin(t * 1.25) * 1.8;
    return { x, y: wl - 128 * s + bob, s, rot };
  }

  function frame() {
    const t = performance.now() / 1000;
    if (mode === 'sail' || mode === 'quit') sailTick();
    layout();
    drawSea(t);
    const p = boatPose(t);
    boat.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.s}) translate(120px, 128px) rotate(${p.rot}deg) translate(-120px, -128px)`;
    const ds = geo.s0 * 1.05;
    dockPet.style.transform = `translate(${geo.pierW * 0.42 - 30 * ds}px, ${geo.deckY - 62 * ds}px) scale(${ds})`;
    // 말풍선 기준점: 선장 머리 위
    let ax, ay;
    if (mode === 'dock') { ax = geo.pierW * 0.42; ay = geo.deckY - 56 * ds; }
    else { const bx = boatFlipped ? 240 - 154 : 154; ax = p.x + bx * p.s; ay = p.y + (mode === 'home' && !gaveUpLast && caught > 0 ? -6 : 44) * p.s; }
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    const left = clamp(ax - 30, 8, geo.W - bw - 8), top = Math.max(6, ay - bh - 12);
    bubble.style.transform = `translate(${left}px, ${top}px)`;
    bubble.style.setProperty('--tail', clamp(ax - left - 8, 12, bw - 26) + 'px');
    rafWin = pipWin || window;
    raf = rafWin.requestAnimationFrame(frame);
  }

  function say(html) {
    bubble.classList.add('fade');
    setTimeout(() => { bubble.innerHTML = html; bubble.classList.remove('fade'); }, 220);
  }

  /* ---------- 지갑 ---------- */
  function renderWallet(pop) {
    $('walletNum').textContent = bank.fish;
    if (pop) { const w = $('wallet'); w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop'); }
  }

  /* ---------- 1단계: 선장, 시간 ---------- */
  function renderPets() {
    const c = PETS[bank.captain];
    $('pets').innerHTML = ORDER.map((id) => `<button class="pet-card" data-pet="${id}" aria-pressed="${id === bank.captain}" aria-label="${PETS[id].name}"><svg viewBox="0 2 60 62">${petSvg(id, 'idle', bank.wear[id])}</svg></button>`).join('') +
      `<div class="pet-info"><b>${c.name}</b><span>${c.kind}, ${c.desc}</span></div>`;
  }
  $('pets').addEventListener('click', (e) => {
    const b = e.target.closest('[data-pet]'); if (!b) return;
    bank.captain = b.dataset.pet; saveBank();
    renderPets(); renderBoat(); updateHint();
    say(LINES[bank.captain].hello);
  });
  const chips = [...document.querySelectorAll('.chip')];
  function updateHint() {
    const crew = crewOf(bank.captain).map((x) => PETS[x].name);
    $('pickHint').textContent = `예상 물고기 ${Math.floor(minutes / BASE_EVERY * rate())}마리` + (crew.length ? `, 항해원 ${crew.length}명` : '');
    $('go').textContent = `${minutes}분 출항시키기`;
  }
  const lenLine = (m) => LINES[bank.captain][m <= 15 ? 'short' : m <= 50 ? 'mid' : 'long'];
  chips.forEach((c) => c.addEventListener('click', () => {
    chips.forEach((o) => o.setAttribute('aria-pressed', String(o === c)));
    $('customMin').value = ''; minutes = +c.dataset.min; updateHint(); say(lenLine(minutes));
  }));
  $('customMin').addEventListener('input', (e) => {
    const v = Math.round(+e.target.value);
    if (v >= 1 && v <= 300) { chips.forEach((o) => o.setAttribute('aria-pressed', 'false')); minutes = v; updateHint(); }
  });
  $('customMin').addEventListener('change', () => say(lenLine(minutes)));

  function show(step) {
    ['stepPick', 'stepSail', 'stepQuit', 'stepDone', 'stepShop'].forEach((s) => { $(s).hidden = s !== step; });
  }

  /* ---------- 출항 ---------- */
  $('go').addEventListener('click', () => {
    if (bank.today !== todayStr()) { bank.today = todayStr(); bank.todayCount = 0; }
    startAt = Date.now(); endAt = startAt + minutes * 60000; tripCrew = bank.crew;
    saveTrip({ startAt, endAt, minutes, crew: tripCrew });
    beginSail();
    const n = bank.todayCount + 1;
    say(n >= 2 ? LINES[bank.captain].streak(n) : '좋아, 출발!<br>시간 다 될 때까지 못 돌아와.');
  });

  function beginSail() {
    mode = 'sail'; homeAnim = null; boatFlipped = false; caught = 0; lastLine = ''; progress = 0;
    speed = 1; simNow = Date.now(); lastReal = performance.now(); $('ff').textContent = '시안용 빨리감기';
    renderBoat(); show('stepSail'); requestWakeLock();
  }

  const fmt = (ms) => {
    const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(r).padStart(2, '0');
  };
  const fishAt = (ms) => Math.floor(ms / (BASE_EVERY * 60000) * (1 + 0.5 * tripCrew));

  function phaseLine(p) {
    const L = LINES[bank.captain];
    if (p < 0.08) return null;
    if (p < 0.4) return ['early', L.early];
    if (p < 0.6) return ['far', L.far];
    if (p < 0.88) return ['back', L.back];
    return ['near', L.near];
  }

  function sailTick() {
    const realNow = performance.now();
    simNow += (realNow - lastReal) * speed; lastReal = realNow;
    if (speed === 1) simNow = Math.max(simNow, Date.now());
    const total = endAt - startAt, elapsed = clamp(simNow - startAt, 0, total);
    progress = elapsed / total;
    const flip = progress > 0.5, n = fishAt(elapsed);
    if (flip !== boatFlipped || n !== caught) { boatFlipped = flip; caught = n; renderBoat(); }
    $('timer').textContent = fmt(endAt - simNow);
    $('bar').style.width = (progress * 100) + '%';
    $('sailStatus').textContent = progress < 0.5 ? '먼 바다로 나가는 중' : '부두로 돌아오는 중';
    $('fishNow').textContent = `물고기 ${n}마리`;
    const ph = mode === 'sail' && phaseLine(progress);
    if (ph && ph[0] !== lastLine) { lastLine = ph[0]; say(pick(ph[1])); }
    if (progress >= 1) arrive(false);
  }

  $('ff').addEventListener('click', () => {
    speed = speed === 1 ? 150 : 1;
    if (speed === 1) simNow = Date.now();
    $('ff').textContent = speed === 1 ? '시안용 빨리감기' : '원래 속도로';
  });

  // 일찍 돌아오기
  $('quit').addEventListener('click', () => { mode = 'quit'; show('stepQuit'); say(LINES[bank.captain].quit); });
  $('quitNo').addEventListener('click', () => { mode = 'sail'; show('stepSail'); say(pick(LINES[bank.captain].early)); });
  $('quitYes').addEventListener('click', () => {
    const half = Math.floor(caught / 2);
    homeAnim = { t0: performance.now(), q: Math.sin(Math.PI * progress), cb: () => { caught = half; arrive(true); } };
    progress = 0; mode = 'returning'; boatFlipped = true; renderBoat(); show('stepSail');
    $('sailStatus').textContent = '부두로 돌아오는 중';
  });

  function arrive(gaveUp) {
    saveTrip(null); releaseWakeLock();
    const total = endAt - startAt;
    if (!gaveUp) caught = fishAt(total);
    progress = 0; mode = 'home'; boatFlipped = false; homeAnim = null; gaveUpLast = gaveUp;
    bank.fish += caught;
    if (!gaveUp) { if (bank.today !== todayStr()) { bank.today = todayStr(); bank.todayCount = 0; } bank.todayCount++; }
    saveBank(); renderWallet(true); renderBoat();
    const L = LINES[bank.captain];
    lastLine = ''; say(gaveUp ? L.giveup(caught) : L.done(caught));
    $('doneTitle').textContent = gaveUp ? '일찍 돌아왔어요' : `${Math.round(total / 60000)}분 항해 끝!`;
    $('doneText').textContent = `물고기 ${caught}마리를 받았어요. 모은 물고기 ${bank.fish}마리` + (!gaveUp && bank.todayCount >= 2 ? `, 오늘 ${bank.todayCount}번째 항해` : '');
    show('stepDone');
  }

  function backToDock(line) {
    mode = 'dock'; homeAnim = null; caught = 0; boatFlipped = false; progress = 0;
    renderBoat(); renderPets(); updateHint(); show('stepPick');
    if (line) say(line);
  }
  $('again').addEventListener('click', () => backToDock(LINES[bank.captain].hello));

  /* ---------- 상점 ---------- */
  let shopTab = 'crew';
  const buyBtn = (label, attrs, disabled, owned) => `<button class="buy${owned ? ' owned' : ''}" ${attrs} ${disabled ? 'disabled' : ''}>${label}</button>`;
  const row = (icon, name, desc, right, vb = '0 2 60 62') => `<div class="item"><svg viewBox="${vb}">${icon}</svg><div class="txt"><b>${name}</b>${desc ? `<span>${desc}</span>` : ''}</div>${right}</div>`;
  function renderShop() {
    const cap = bank.captain;
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === shopTab)));
    let h = '';
    if (shopTab === 'crew') {
      h = ORDER.filter((x) => x !== cap).map((id, i) => {
        const hired = i < bank.crew, next = i === bank.crew, cost = CREW_COST[i];
        return row(petSvg(id, 'idle', bank.wear[id]), `${PETS[id].name} 구인`, '같이 타면 물고기 50% 더',
          hired ? '<span class="state">승선 중</span>' : next ? buyBtn(`${cost}마리`, `data-crew="${i}"`, bank.fish < cost) : '<span class="state" style="color:var(--mute)">다음 차례</span>');
      }).join('');
    } else if (shopTab === 'flag') {
      h = Object.entries(FLAGS).map(([id, f]) => {
        const own = bank.flags.includes(id), on = bank.flag === id;
        return row(flagSvg(id), f.name, '', on ? '<span class="state">달려 있음</span>' : own ? buyBtn('달기', `data-flag="${id}"`, false, true) : buyBtn(`${f.cost}마리`, `data-flag="${id}"`, bank.fish < f.cost), '-4 -6 36 28');
      }).join('');
    } else {
      h = Object.entries(OUTFITS).map(([id, o]) => {
        const own = bank.outfits.includes(id), on = bank.wear[cap] === id;
        return row(petSvg(cap, 'idle', id), o.name, on ? `${PETS[cap].name} 착용 중` : '',
          on ? buyBtn('벗기기', `data-wear="${id}"`, false, true) : own ? buyBtn('입히기', `data-wear="${id}"`, false, true) : buyBtn(`${o.cost}마리`, `data-wear="${id}"`, bank.fish < o.cost), '0 -6 60 70');
      }).join('');
    }
    $('shopList').innerHTML = h;
  }
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => { shopTab = t.dataset.tab; renderShop(); }));
  $('stepShop').addEventListener('click', (e) => {
    const b = e.target.closest('.buy'); if (!b || b.disabled) return;
    const cap = bank.captain;
    if (b.dataset.crew) {
      const i = +b.dataset.crew, cost = CREW_COST[i];
      if (bank.fish < cost) return;
      bank.fish -= cost; bank.crew = i + 1;
      const who = PETS[ORDER.filter((x) => x !== cap)[i]].name;
      say(cap === 'moon' ? `${who}, 합류를 환영한다.<br>짐은 저쪽에.` : cap === 'dal' ? `${who} 왔다아!<br>같이 가자!` : `${who}도 같이 간대...<br>이제 덜 무서워`);
    } else if (b.dataset.flag) {
      const id = b.dataset.flag;
      if (!bank.flags.includes(id)) { if (bank.fish < FLAGS[id].cost) return; bank.fish -= FLAGS[id].cost; bank.flags.push(id); }
      bank.flag = id; say(`${FLAGS[id].name} 달았다!<br>멋지지?`);
    } else if (b.dataset.wear) {
      const id = b.dataset.wear;
      if (bank.wear[cap] === id) delete bank.wear[cap];
      else {
        if (!bank.outfits.includes(id)) { if (bank.fish < OUTFITS[id].cost) return; bank.fish -= OUTFITS[id].cost; bank.outfits.push(id); }
        bank.wear[cap] = id;
        say(cap === 'moon' ? '흠.<br>나쁘지 않군.' : cap === 'dal' ? '우와 나 완전 멋있어!' : '어... 어울려...?<br>헤헤');
      }
    } else return;
    saveBank(); renderWallet(true); renderBoat(); renderShop(); renderPets(); updateHint();
  });
  function openShop() {
    mode = 'dock'; caught = 0; homeAnim = null; boatFlipped = false;
    renderBoat(); renderShop(); show('stepShop');
    say(bank.captain === 'moon' ? '쇼핑인가.<br>계획적으로 써라.' : bank.captain === 'dal' ? '쇼핑이다!<br>뭐 살까 뭐 살까!' : '뭐 사줄 거야...?');
  }
  $('openShop').addEventListener('click', openShop);
  $('doneShop').addEventListener('click', openShop);
  $('closeShop').addEventListener('click', () => backToDock(LINES[bank.captain].hello));
  $('demoFish').addEventListener('click', () => { bank.fish += 30; saveBank(); renderWallet(true); renderShop(); });

  /* ---------- 작은 창 (Document Picture-in-Picture) ---------- */
  const widget = $('widget'), widgetHome = document.createComment('widget');
  widget.before(widgetHome);
  if ('documentPictureInPicture' in window) $('pipBtn').hidden = false; else $('note').hidden = true;
  function restartLoop() { try { rafWin.cancelAnimationFrame(raf); } catch (e) {} lastReal = performance.now(); frame(); }
  async function openPip() {
    if (pipWin) return;
    try { pipWin = await window.documentPictureInPicture.requestWindow({ width: 340, height: 330 }); }
    catch (e) { pipWin = null; say('여기선 작은 창이 안 열려요.<br>배포된 사이트를 크롬이나 엣지로 열어주세요.'); return; }
    const d = pipWin.document, fontUrl = new URL('PretendardVariable.woff2', location.href).href;
    document.querySelectorAll('style').forEach((st) => {
      const c = d.createElement('style');
      c.textContent = st.textContent.replace(/url\("PretendardVariable\.woff2"\)/g, `url("${fontUrl}")`);
      d.head.append(c);
    });
    d.title = '집중 원양어선'; d.documentElement.classList.add('pip');
    d.body.append(widget);
    $('popped').hidden = false; $('pipBtn').textContent = '작은 창 열림';
    pipWin.addEventListener('pagehide', () => {
      widgetHome.after(widget); $('popped').hidden = true; $('pipBtn').textContent = '작은 창으로 띄우기';
      pipWin = null; restartLoop();
    });
    restartLoop();
    if (mode === 'dock') say(bank.captain === 'moon' ? '여기서 지켜보겠다.' : '여기서 지켜볼게!<br>출항 버튼 눌러줘');
  }
  $('pipBtn').addEventListener('click', openPip);
  $('pipBack').addEventListener('click', () => pipWin?.close());

  /* ---------- 화면 꺼짐 방지 ---------- */
  let lock = null;
  async function requestWakeLock() { try { lock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
  function releaseWakeLock() { try { lock?.release(); } catch (e) {} lock = null; }

  /* ---------- 시작 ---------- */
  renderWallet(false); renderPets(); updateHint(); renderBoat();
  bubble.innerHTML = LINES[bank.captain].hello;
  const saved = loadTrip();
  if (saved && saved.endAt > Date.now()) { ({ startAt, endAt, minutes } = saved); tripCrew = saved.crew || 0; beginSail(); }
  else if (saved) { ({ startAt, endAt, minutes } = saved); tripCrew = saved.crew || 0; arrive(false); }
  frame();
})();
</script>
</body>
</html>
