<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>집중 원양어선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920;
  font-display: swap;
  src: url("PretendardVariable.woff2") format("woff2-variations");
}
/* 한 화면 앱: 위는 바다 장면(왼쪽 부두에서 오른쪽 먼 바다로 갔다가 돌아옴), 아래는 조작 패널 */
:root {
  --bg: #eceef0;
  --sky: #e4e7ea;
  --sea: #c9d3db;
  --sea-deep: #b4c1cc;
  --ink: #2b2f33;
  --mute: #7c848b;
  --line: #d3d8dd;
  --card: #f7f8f9;
  --accent: #3d5a73;
  --hat: #f2c94c;
  --boat: #8a5a3b;
  --boat-dark: #6b4329;
  --dock: #a7a29a;
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d2126; --sky: #222830; --sea: #2c3a47; --sea-deep: #24313d; --ink: #e8ebee; --mute: #98a1a9;
  --line: #36404a; --card: #262c33; --accent: #9fbbd2; --dock: #5d5953; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1d2126; --sky: #222830; --sea: #2c3a47; --sea-deep: #24313d; --ink: #e8ebee; --mute: #98a1a9;
  --line: #36404a; --card: #262c33; --accent: #9fbbd2; --dock: #5d5953; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font);
  display: flex; flex-direction: column; overflow-x: hidden;
}
header {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-block: 18px 6px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.brand { font-weight: 800; letter-spacing: .14em; font-size: 13px; }
.sub { color: var(--mute); font-size: 13px; }
.wallet {
  display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px;
  font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px 5px 9px;
}
.wallet svg { width: 22px; height: 14px; }
.wallet.pop { animation: pop .5s; }
@keyframes pop { 40% { transform: scale(1.15); } }
.head-right { display: flex; align-items: center; gap: 12px; }
@media (max-width: 520px) { .sub { display: none; } }

/* 상점 */
.shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.item {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  display: grid; gap: 4px; align-content: start;
}
.item b { font-size: 15px; }
.item span { font-size: 13px; color: var(--mute); line-height: 1.4; }
.item.now { border-color: var(--ink); }
.item.done { opacity: .55; }
.item .btn { font-size: 14px; padding: 9px 10px; margin-top: 6px; }
/* 작은 창(PIP) 모드 */
.pip-btn { font-size: 13px; padding: 7px 12px; }
.mini-hud { display: none; }
.popped {
  flex: 1 1 auto; min-height: 300px; display: grid; place-content: center; gap: 12px; text-align: center;
  color: var(--mute); font-size: 15px; background: var(--sky);
}
.popped[hidden] { display: none !important; }
.pip body { display: block; }
.pip .scene { position: fixed; inset: 0; min-height: 0; }
.pip .mini-hud {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  position: absolute; left: 10px; right: 10px; bottom: 8px;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.pip .mini-hud b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.pip .mini-hud span { font-size: 13px; font-weight: 700; }
.pip .boat-wrap { width: 92px; top: calc(52% - 56px); }
.pip .scene { background: linear-gradient(var(--sky) 0 52%, var(--sea) 52% 100%); }
.pip .waves { top: 52%; }
.pip .dock { top: calc(52% - 8px); width: 18%; min-width: 60px; height: 12px; }
.pip .pet-dock { width: 38px; top: calc(52% - 46px); left: 8px; }
.pip .dock-sign, .pip .horizon-label { display: none; }
.pip .bubble { font-size: 12px; padding: 6px 10px; max-width: 190px; border-radius: 10px; bottom: calc(100% + 6px); }
.item .tag { font-size: 12px; font-weight: 700; color: var(--accent); }

/* 장면 */
.scene {
  position: relative; flex: 1 1 auto; min-height: 300px; overflow: hidden;
  background: linear-gradient(var(--sky) 0 58%, var(--sea) 58% 100%);
}
.horizon-label {
  position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(58% - 26px);
  font-size: 12px; color: var(--mute); letter-spacing: .08em;
}
.waves { position: absolute; left: 0; right: 0; top: 58%; bottom: 0; }
.wave {
  position: absolute; left: -50%; width: 200%; height: 14px; opacity: .5;
  background: radial-gradient(circle at 10px -4px, transparent 12px, var(--sea-deep) 13px) 0 0 / 20px 14px repeat-x;
  animation: drift 9s linear infinite;
}
.wave:nth-child(1) { top: 18%; }
.wave:nth-child(2) { top: 48%; animation-duration: 13s; animation-direction: reverse; opacity: .35; }
.wave:nth-child(3) { top: 78%; animation-duration: 7s; }
@keyframes drift { to { transform: translateX(20%); } }

.dock {
  position: absolute; left: 0; top: calc(58% - 10px); width: 13%; min-width: 92px; height: 18px;
  background: var(--dock); border-radius: 0 3px 3px 0;
}
.dock::before, .dock::after {
  content: ""; position: absolute; top: 18px; width: 8px; height: 60px; background: var(--dock); opacity: .8;
}
.dock::before { left: 18%; } .dock::after { left: 70%; }
.dock-sign {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(58% - 96px);
  font-size: 11px; font-weight: 700; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); padding: 4px 8px; border-radius: 4px; white-space: nowrap;
}

.boat-wrap {
  position: absolute; top: calc(58% - 92px); left: 0; width: 150px;
  transform: translateX(var(--x, 60px));
}
.boat-wrap svg { width: 100%; height: auto; display: block; }
@media (max-width: 520px) { .boat-wrap { width: 112px; top: calc(58% - 70px); } }
.boat-wrap.returning-home { transition: transform 1.2s ease-out; }
[data-lv] { display: none; }
.lv-1 [data-lv~="1"], .lv-2 [data-lv~="2"], .lv-3 [data-lv~="3"], .lv-4 [data-lv~="4"] { display: inline; }
.boat-bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 80%; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(5px) rotate(1.5deg); } }
.boat-wrap.facing-left .flip { transform: scaleX(-1); }
.flip { transition: transform .5s; }

/* 부두 위 캐릭터 */
.pet-dock {
  position: absolute; width: 58px; top: calc(58% - 66px);
  left: max(18px, calc(env(safe-area-inset-left, 0px) + 18px));
  transition: transform .7s cubic-bezier(.3,1.6,.5,1), opacity .2s .6s;
}
.pet-dock.hop { transform: translate(70px, -10px); opacity: 0; }
.pet-in-boat { opacity: 0; transition: opacity .2s; }
.boarded .pet-in-boat { opacity: 1; }

.bubble {
  position: absolute; bottom: calc(100% + 10px); left: 30px; width: max-content; max-width: min(260px, 70vw);
  background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.45; font-weight: 600;
  box-shadow: 0 6px 18px rgba(30,40,50,.08);
  transition: opacity .3s;
}
.bubble::after {
  content: ""; position: absolute; left: var(--tail, 26px); top: 100%; border: 8px solid transparent; border-top-color: var(--card);
}
.bubble.fade { opacity: 0; }

/* 패널 */
.panel {
  flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--bg);
  padding-block: 20px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.inner { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.label { font-size: 13px; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 16px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.custom { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--mute); }
.custom input {
  width: 64px; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); text-align: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 6px;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
.btn {
  font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
  background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 13px 22px;
}
:root[data-theme="dark"] .btn { color: #16202a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #16202a; } }
.btn.ghost { background: transparent; color: var(--mute); border: 1px solid var(--line); font-size: 13px; padding: 9px 14px; font-weight: 600; }
.timer { font-size: clamp(44px, 9vw, 64px); font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.status { font-size: 15px; color: var(--mute); }
.track { position: relative; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 3px; }
.result-title { font-size: 22px; font-weight: 800; }
.fish { font-size: 15px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .wave, .boat-bob { animation: none; } .boat-wrap { transition: none; } }
</style>
</head>
<body>

<header>
  <span class="brand">EMPTY CHAIR</span>
  <span class="head-right">
    <span class="sub">집중 원양어선</span>
    <button class="btn ghost pip-btn" id="pipBtn" hidden>작은 창으로 띄우기</button>
    <span class="wallet" id="wallet" title="모은 물고기">
      <svg viewBox="0 0 22 14" aria-hidden="true"><path d="M2 7 Q8 0 15 7 Q8 14 2 7 Z" fill="var(--accent)"/><path d="M14 7 L21 2 V12 Z" fill="var(--accent)"/><circle cx="6" cy="6" r="1.2" fill="var(--card)"/></svg>
      <span id="walletNum">0</span>
    </span>
  </span>
</header>

<div class="scene" id="scene">
  <div class="waves"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
  <span class="horizon-label">먼 바다</span>
  <div class="dock"></div>
  <div class="mini-hud"><b id="miniTimer">대기 중</b><span id="miniFish"></span></div>
  <span class="dock-sign">밀양행 원양어선 출항장</span>

  <!-- 부두 위에 서 있는 펫 -->
  <svg class="pet-dock" id="petDock" viewBox="0 0 60 64" aria-hidden="true">
    <ellipse cx="30" cy="42" rx="22" ry="19" fill="#fbfaf7" stroke="#2b2f33" stroke-width="2"/>
    <path d="M10 26 Q30 2 50 26 Z" fill="#f2c94c" stroke="#2b2f33" stroke-width="2" stroke-linejoin="round"/>
    <path d="M5 27 H55" stroke="#2b2f33" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="22" cy="40" r="2.4" fill="#2b2f33"/><circle cx="38" cy="40" r="2.4" fill="#2b2f33"/>
    <ellipse cx="17" cy="46" rx="3.5" ry="2" fill="#f4b6b0"/><ellipse cx="43" cy="46" rx="3.5" ry="2" fill="#f4b6b0"/>
    <path d="M27 46 Q30 49 33 46" fill="none" stroke="#2b2f33" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="22" cy="61" rx="5" ry="2.5" fill="#2b2f33"/><ellipse cx="38" cy="61" rx="5" ry="2.5" fill="#2b2f33"/>
  </svg>

  <div class="boat-wrap" id="boat">
    <div class="bubble" id="bubble">나 진짜 떠난다?<br>집중할 수 있지?</div>
    <div class="boat-bob"><div class="flip">
      <svg viewBox="0 0 150 100" aria-label="펫이 탄 고기잡이 배" id="boatSvg" class="lv-1">
        <!-- 돛대와 깃발 -->
        <path d="M98 6 V58" stroke="#6b4329" stroke-width="3"/>
        <path d="M98 8 L122 15 L98 22 Z" fill="#3d5a73"/>
        <path data-lv="4" d="M98 24 L116 29 L98 34 Z" fill="#f2c94c"/>
        <!-- Lv2+ 조타실과 연기 -->
        <g data-lv="2 3 4">
          <rect x="104" y="36" width="28" height="24" rx="3" fill="#f7f1e8" stroke="#6b4329" stroke-width="2"/>
          <rect x="110" y="41" width="9" height="8" rx="1.5" fill="#c9d3db" stroke="#6b4329" stroke-width="1.5"/>
          <rect x="124" y="26" width="6" height="10" fill="#6b4329"/>
          <circle cx="130" cy="18" r="4" fill="#c9d3db" opacity=".8"/><circle cx="136" cy="10" r="3" fill="#c9d3db" opacity=".6"/>
        </g>
        <!-- Lv3+ 그물과 집어등 -->
        <g data-lv="3 4">
          <path d="M98 30 L12 58" stroke="#7c848b" stroke-width="1.2" stroke-dasharray="3 3"/>
          <circle cx="30" cy="52" r="2.6" fill="#f2c94c"/><circle cx="52" cy="45" r="2.6" fill="#f2c94c"/><circle cx="74" cy="38" r="2.6" fill="#f2c94c"/>
        </g>
        <!-- 펫 (배 안) -->
        <g class="pet-in-boat" transform="translate(34 18)">
          <ellipse cx="30" cy="42" rx="22" ry="19" fill="#fbfaf7" stroke="#2b2f33" stroke-width="2"/>
          <path d="M10 26 Q30 2 50 26 Z" fill="#f2c94c" stroke="#2b2f33" stroke-width="2" stroke-linejoin="round"/>
          <path d="M5 27 H55" stroke="#2b2f33" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="22" cy="40" r="2.4" fill="#2b2f33"/><circle cx="38" cy="40" r="2.4" fill="#2b2f33"/>
          <ellipse cx="17" cy="46" rx="3.5" ry="2" fill="#f4b6b0"/><ellipse cx="43" cy="46" rx="3.5" ry="2" fill="#f4b6b0"/>
          <path d="M27 46 Q30 49 33 46" fill="none" stroke="#2b2f33" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <!-- 선체 -->
        <path id="hull" d="M8 60 H142 L126 90 H26 Z" fill="#8a5a3b" stroke="#6b4329" stroke-width="2" stroke-linejoin="round"/>
        <path d="M14 68 H137" stroke="#6b4329" stroke-width="2"/>
        <path data-lv="4" d="M18 74 H133" stroke="#f7f1e8" stroke-width="2"/>
        <circle cx="40" cy="80" r="4" fill="#eceef0" stroke="#6b4329" stroke-width="2"/>
        <text id="boatName" x="86" y="85" font-size="10" font-weight="800" fill="#f7f1e8" text-anchor="middle" font-family="Pretendard Variable, sans-serif">나룻배</text>
      </svg>
    </div></div>
  </div>
</div>

<div class="popped" id="popped" hidden>
  <div>펫이 작은 창으로 나가서 화면 위에 떠 있어요.<br>다른 탭에서 공부해도 계속 보여요.</div>
  <div><button class="btn ghost" id="pipBack">다시 데려오기</button></div>
</div>

<div class="panel">
  <!-- 1. 출항 전 -->
  <div class="inner" id="stepPick">
    <div class="label">어선에 몇 분 동안 태울까요? 이 시간이 끝나야 돌아올 수 있어요.</div>
    <div class="chips" id="chips">
      <button class="chip" data-min="15" aria-pressed="false">15분</button>
      <button class="chip" data-min="25" aria-pressed="true">25분</button>
      <button class="chip" data-min="50" aria-pressed="false">50분</button>
      <button class="chip" data-min="90" aria-pressed="false">90분</button>
      <label class="custom">직접 <input id="customMin" type="number" min="1" max="300" placeholder="40" inputmode="numeric"> 분</label>
    </div>
    <div class="row">
      <span class="status" id="pickHint">25분 뒤에 돌아와요</span>
      <span class="chips">
        <button class="btn ghost" id="openShop">배 업그레이드</button>
        <button class="btn" id="go">출항시키기</button>
      </span>
    </div>
  </div>

  <!-- 상점 -->
  <div class="inner" id="stepShop" hidden>
    <div class="row">
      <span class="label">모은 물고기로 배를 바꾸면 더 빨리 잡아와요.</span>
      <span class="chips">
        <button class="btn ghost" id="demoFish" hidden>시안용 물고기 +20</button>
        <button class="btn ghost" id="closeShop">돌아가기</button>
      </span>
    </div>
    <div class="shop" id="shop"></div>
  </div>

  <!-- 2. 항해 중 -->
  <div class="inner" id="stepSail" hidden>
    <div class="row">
      <div>
        <div class="timer" id="timer">25:00</div>
        <div class="status" id="sailStatus">부두를 떠나는 중</div>
      </div>
      <div class="fish" id="fishNow">잡은 물고기 0마리</div>
    </div>
    <div class="track"><i id="bar"></i></div>
    <div class="row">
      <span class="label">배는 시간이 끝나기 전엔 돌아오지 않아요.</span>
      <button class="btn ghost" id="ff" hidden>시안용 빨리감기</button>
    </div>
  </div>

  <!-- 3. 귀항 -->
  <div class="inner" id="stepDone" hidden>
    <div class="result-title" id="doneTitle">무사히 돌아왔어!</div>
    <div class="fish" id="doneText"></div>
    <div class="row">
      <button class="btn ghost" id="doneShop">배 업그레이드</button>
      <button class="btn" id="again">다시 출항하기</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cache = {};
  const $ = (id) => cache[id] || (cache[id] = document.getElementById(id)); // 장면이 작은 창으로 옮겨가도 찾을 수 있게 캐시
  document.querySelectorAll('[id]').forEach((el) => { cache[el.id] = el; });
  const scene = $('scene'), boat = $('boat'), bubble = $('bubble'), petDock = $('petDock');
  const KEY = 'focusBoat.v1', BANK = 'focusBoat.bank.v1';
  let minutes = 25, endAt = 0, startAt = 0, speed = 1, raf = 0, lastLine = '';
  let simNow = 0, lastReal = 0, tripLevel = 1, pipWin = null, rafWin = window;
  const stopLoop = () => { try { rafWin.cancelAnimationFrame(raf); } catch (e) {} };

  const save = (v) => { try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch (e) {} };
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } };

  // 배 단계: every = 몇 분마다 한 마리, cost = 이 배로 바꾸는 데 드는 물고기
  const BOATS = [
    { lv: 1, name: '나룻배', every: 5, cost: 0, hull: '#8a5a3b', desc: '5분마다 1마리' },
    { lv: 2, name: '통통배', every: 4, cost: 15, hull: '#8a5a3b', desc: '조타실이 생겨요. 4분마다 1마리' },
    { lv: 3, name: '고깃배', every: 3, cost: 40, hull: '#5f7a64', desc: '그물과 집어등. 3분마다 1마리' },
    { lv: 4, name: '원양어선', every: 2, cost: 100, hull: '#34506a', desc: '먼 바다 전문. 2분마다 1마리' },
  ];
  let bank = { fish: 0, level: 1 };
  try { bank = Object.assign(bank, JSON.parse(localStorage.getItem(BANK) || '{}')); } catch (e) {}
  const saveBank = () => { try { localStorage.setItem(BANK, JSON.stringify(bank)); } catch (e) {} };
  const boatOf = (lv) => BOATS[lv - 1];

  function renderBank(pop) {
    $('walletNum').textContent = bank.fish;
    if (pop) { $('wallet').classList.remove('pop'); void $('wallet').offsetWidth; $('wallet').classList.add('pop'); }
    const b = boatOf(bank.level);
    $('boatSvg').setAttribute('class', 'lv-' + b.lv);
    $('hull').setAttribute('fill', b.hull);
    $('boatName').textContent = b.name;
    $('shop').innerHTML = BOATS.map((x) => {
      const state = x.lv < bank.level ? 'done' : x.lv === bank.level ? 'now' : '';
      const btn = x.lv === bank.level + 1
        ? `<button class="btn" data-buy="${x.lv}" ${bank.fish < x.cost ? 'disabled style="opacity:.45;cursor:default"' : ''}>물고기 ${x.cost}마리로 바꾸기</button>`
        : '';
      const tag = x.lv === bank.level ? '<span class="tag">지금 타는 배</span>' : x.lv < bank.level ? '<span class="tag">지나온 배</span>' : `<span class="tag">물고기 ${x.cost}마리</span>`;
      return `<div class="item ${state}">${tag}<b>Lv.${x.lv} ${x.name}</b><span>${x.desc}</span>${btn}</div>`;
    }).join('');
  }
  $('shop').addEventListener('click', (e) => {
    const lv = +e.target.dataset.buy; if (!lv) return;
    const x = boatOf(lv); if (bank.fish < x.cost) return;
    bank.fish -= x.cost; bank.level = lv; saveBank(); renderBank(true);
    say(`우와, ${x.name}이다!<br>이제 ${x.every}분마다 한 마리씩 잡아올게.`);
  });
  $('openShop').addEventListener('click', () => {
    $('stepPick').hidden = true; $('stepShop').hidden = false;
    const next = BOATS[bank.level];
    say(next ? `${next.name} 갖고 싶다...<br>물고기 ${next.cost}마리면 돼!` : '최고의 배야.<br>이제 바다는 내 거야!');
  });
  $('closeShop').addEventListener('click', () => { $('stepShop').hidden = true; $('stepPick').hidden = false; say('나 진짜 떠난다?<br>집중할 수 있지?'); });
  $('demoFish').addEventListener('click', () => { bank.fish += 20; saveBank(); renderBank(true); });

  function say(text, align) {
    bubble.classList.add('fade');
    setTimeout(() => {
      bubble.innerHTML = text;
      bubble.classList.remove('fade');
      fitBubble();
    }, 250);
  }

  // 배 위치: 0 → 1 → 0 (먼 바다 갔다가 돌아옴)
  function homeX() { return Math.max(pipWin ? 50 : 84, scene.clientWidth * 0.08); }
  function farX() { return scene.clientWidth - boat.offsetWidth - 20; }
  function place(p) {
    const x = homeX() + (farX() - homeX()) * Math.sin(Math.PI * p);
    boat.style.setProperty('--x', x + 'px');
    boat.classList.toggle('facing-left', p > 0.5);
    fitBubble(x);
  }
  // 말풍선이 화면 밖으로 나가지 않게 위치 조정
  function fitBubble(x) {
    if (x === undefined) { const m = /([\d.]+)px/.exec(boat.style.getPropertyValue('--x')); x = m ? +m[1] : homeX(); }
    const W = scene.clientWidth, bw = bubble.offsetWidth, petCenter = x + boat.offsetWidth * 0.4;
    let left = petCenter - 34;
    left = Math.min(left, W - bw - 12); left = Math.max(left, 12);
    bubble.style.left = (left - x) + 'px';
    bubble.style.setProperty('--tail', Math.min(bw - 30, Math.max(14, petCenter - left - 8)) + 'px');
  }

  // 시안 단계 1: 시간 고르기
  const chips = [...document.querySelectorAll('.chip')];
  function setMinutes(m) {
    minutes = m;
    $('pickHint').textContent = `${m}분 뒤에 돌아와요`;
  }
  chips.forEach((c) => c.addEventListener('click', () => {
    chips.forEach((o) => o.setAttribute('aria-pressed', String(o === c)));
    $('customMin').value = '';
    setMinutes(+c.dataset.min);
    const lines = {
      15: '15분? 금방 다녀올게.<br>그 사이 딴짓하면 안 돼!',
      25: '25분이면 딱 좋아.<br>나 진짜 떠난다?',
      50: '50분이나?<br>나 멀리 가는 거야... 버틸 수 있지?',
      90: '90분이면 원양 어업이야.<br>도시락 챙겨야겠다.',
    };
    say(lines[c.dataset.min]);
  }));
  $('customMin').addEventListener('input', (e) => {
    const v = Math.round(+e.target.value);
    if (v >= 1 && v <= 300) {
      chips.forEach((o) => o.setAttribute('aria-pressed', 'false'));
      setMinutes(v);
    }
  });

  // 출항
  $('go').addEventListener('click', () => {
    say('좋아, 출발!<br>시간 다 될 때까지 못 돌아와.');
    petDock.classList.add('hop');
    setTimeout(() => {
      boat.classList.add('boarded');
      startAt = Date.now(); endAt = startAt + minutes * 60000;
      tripLevel = bank.level;
      save({ startAt, endAt, minutes, level: tripLevel });
      startSail();
    }, 800);
  });

  function startSail() {
    boat.classList.remove('returning-home');
    $('stepPick').hidden = true; $('stepShop').hidden = true; $('stepSail').hidden = false; $('stepDone').hidden = true;
    petDock.classList.add('hop'); boat.classList.add('boarded');
    speed = 1; $('ff').textContent = '시안용 빨리감기';
    simNow = Date.now(); lastReal = performance.now();
    requestWakeLock();
    stopLoop(); tick();
  }

  const fmt = (ms) => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(r).padStart(2, '0');
  };
  const fishAt = (elapsedMs) => Math.floor(elapsedMs / (boatOf(tripLevel).every * 60000)); // 배 단계마다 속도 다름

  function lineFor(p) {
    if (p < 0.12) return ['부두가 점점 멀어진다...<br>이제 진짜 못 돌아가!', 'left'];
    if (p < 0.3) return ['물고기 잡는 중.<br>너는 공부 잡는 중이지?', 'left'];
    if (p < 0.45) return ['파도가 세다.<br>너도 휴대폰 보지 말고 버텨!', 'left'];
    if (p < 0.55) return ['여기가 제일 먼 바다야.<br>딱 절반 왔어!', 'right'];
    if (p < 0.75) return ['이제 돌아가는 중!<br>조금만 더 집중해줘.', 'right'];
    if (p < 0.92) return ['부두가 보인다!<br>마지막까지 힘내.', 'left'];
    return ['거의 다 왔어!<br>정리할 준비해.', 'left'];
  }

  function tick() {
    const realNow = performance.now();
    simNow += (realNow - lastReal) * speed; lastReal = realNow;
    if (speed === 1) simNow = Math.max(simNow, Date.now());
    const total = endAt - startAt, elapsed = Math.min(total, simNow - startAt), p = elapsed / total;
    place(p);
    $('timer').textContent = fmt(endAt - simNow);
    $('bar').style.width = (p * 100) + '%';
    $('sailStatus').textContent = p < 0.5 ? '먼 바다로 나가는 중' : '부두로 돌아오는 중';
    $('fishNow').textContent = `잡은 물고기 ${fishAt(elapsed)}마리`;
    $('miniTimer').textContent = fmt(endAt - simNow); $('miniFish').textContent = `물고기 ${fishAt(elapsed)}마리`;
    const [line, align] = lineFor(p);
    if (line !== lastLine) { lastLine = line; say(line, align); }
    if (p >= 1) return arrive(total);
    rafWin = pipWin || window; raf = rafWin.requestAnimationFrame(tick);
  }

  $('ff').addEventListener('click', () => {
    speed = speed === 1 ? 120 : 1;
    if (speed === 1) simNow = Date.now();
    $('ff').textContent = speed === 1 ? '시안용 빨리감기' : '원래 속도로';
  });

  function arrive(total) {
    save(null); releaseWakeLock();
    boat.classList.add('returning-home'); place(0);
    const n = Math.max(1, fishAt(total));
    bank.fish += n; saveBank(); renderBank(true);
    $('miniTimer').textContent = '도착!'; $('miniFish').textContent = `물고기 +${n}`;
    lastLine = '';
    say(`다녀왔어! 물고기 ${n}마리 잡았어.<br>너도 진짜 집중했구나.`);
    $('stepSail').hidden = true; $('stepDone').hidden = false;
    $('doneTitle').textContent = `${Math.round(total / 60000)}분 항해 끝, 무사히 돌아왔어!`;
    const next = BOATS[bank.level];
    $('doneText').textContent = `물고기 ${n}마리가 지갑에 들어왔어요. 지금 ${bank.fish}마리` + (next ? `, ${next.name}까지 ${Math.max(0, next.cost - bank.fish)}마리 남았어요.` : '.');
  }

  $('doneShop').addEventListener('click', () => {
    $('stepDone').hidden = true; boat.classList.remove('boarded'); petDock.classList.remove('hop');
    $('openShop').click();
  });
  $('again').addEventListener('click', () => {
    $('stepDone').hidden = true; $('stepPick').hidden = false;
    boat.classList.remove('boarded'); petDock.classList.remove('hop');
    say('또 가자고?<br>이번엔 몇 분 탈까?');
  });


  // 작은 창(Document Picture-in-Picture): 펫 장면을 항상 위에 떠 있는 창으로 옮김
  const sceneHome = document.createComment('scene');
  scene.before(sceneHome);
  if ('documentPictureInPicture' in window) $('pipBtn').hidden = false;
  async function openPip() {
    if (pipWin) { pipWin.focus?.(); return; }
    try {
      pipWin = await window.documentPictureInPicture.requestWindow({ width: 340, height: 240 });
    } catch (e) {
      pipWin = null;
      say('여기선 작은 창이 안 열려요.<br>배포된 사이트를 크롬이나 엣지로 열어주세요.');
      return;
    }
    const d = pipWin.document;
    const fontUrl = new URL('PretendardVariable.woff2', location.href).href;
    document.querySelectorAll('style').forEach((st) => {
      const c = d.createElement('style');
      c.textContent = st.textContent.replace(/url\("PretendardVariable\.woff2"\)/g, `url("${fontUrl}")`);
      d.head.append(c);
    });
    d.title = '집중 원양어선';
    d.documentElement.classList.add('pip');
    const theme = document.documentElement.getAttribute('data-theme');
    if (theme) d.documentElement.setAttribute('data-theme', theme);
    d.body.append(scene);
    $('popped').hidden = false; $('pipBtn').textContent = '작은 창 열림';
    pipWin.addEventListener('pagehide', () => {
      sceneHome.after(scene);
      $('popped').hidden = true; $('pipBtn').textContent = '작은 창으로 띄우기';
      pipWin = null; rafWin = window;
      if (!$('stepSail').hidden) { stopLoop(); lastReal = performance.now(); tick(); }
      else place(0);
    });
    if (!$('stepSail').hidden) { stopLoop(); lastReal = performance.now(); tick(); }
    else { place(0); say('여기서 지켜볼게.<br>출항 버튼 누르면 바로 떠날게!'); }
  }
  $('pipBtn').addEventListener('click', openPip);
  $('pipBack').addEventListener('click', () => { pipWin?.close(); });

  // 화면 꺼짐 방지 (가능한 경우만)
  let lock = null;
  async function requestWakeLock() { try { lock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
  function releaseWakeLock() { try { lock?.release(); } catch (e) {} lock = null; }

  window.addEventListener('resize', () => { if (!$('stepSail').hidden) return; place(0); });

  // 새로고침해도 항해 이어가기
  renderBank(false);
  const saved = load();
  place(0);
  if (saved && saved.endAt > Date.now()) {
    ({ startAt, endAt, minutes } = saved); tripLevel = saved.level || bank.level;
    startSail();
  } else if (saved) { save(null); }
})();
</script>
</body>
</html>
